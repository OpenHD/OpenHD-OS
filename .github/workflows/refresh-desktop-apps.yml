name: Track latest stable desktop apps
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official stable releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 debian-x86/desktop-apps.py --lock debian-x86/desktop-apps.lock.json
      - name: Record changes and request a fresh x86 build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! git diff --quiet -- debian-x86/desktop-apps.lock.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add debian-x86/desktop-apps.lock.json
            git commit -m 'Track latest stable flight desktop applications'
            git push
            gh workflow run build.yml --ref main
          fi
