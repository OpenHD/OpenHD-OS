name: Refresh released image with Hyprland and current flight apps
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional draft prerelease tag
        default: ''
permissions:
  contents: read
concurrency:
  group: modern-desktop-image
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_metadata: ${{ inputs.release_tag != '' }}
  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openhd-os-x86
      - name: Stage requested preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease --title 'OpenHD-OS Hyprland preview with current flight apps' --notes '2 GiB Debian image with Hyprland, OpenHD 3.0 wallpaper, and Kite GC, ArduDeck, QGroundControl, INAV and Betaflight preinstalled.' openhd-os-x86.img SHA256SUMS desktop-apps.lock.json
