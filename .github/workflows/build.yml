name: Build Debian image or component packages
on:
  workflow_call:
    inputs:
      output:
        type: string
        default: desktop-image
      release_metadata:
        type: boolean
        default: false
      openhd_ref:
        type: string
        default: snapshots
      qopenhd_ref:
        type: string
        default: snapshots
      sysutils_ref:
        type: string
        default: snapshots
  workflow_dispatch:
    inputs:
      output:
        type: choice
        options: [desktop-image, packages]
        default: desktop-image
      openhd_ref:
        default: snapshots
      qopenhd_ref:
        default: snapshots
      sysutils_ref:
        default: snapshots
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
      - uses: actions/checkout@v4
        with:
          repository: OpenHD/OpenHD
          ref: ${{ inputs.openhd_ref }}
          path: sources/OpenHD
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: OpenHD/QOpenHD
          ref: ${{ inputs.qopenhd_ref }}
          path: sources/QOpenHD
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: OpenHD/OpenHD-SysUtils
          ref: ${{ inputs.sysutils_ref }}
          path: sources/OpenHD-SysUtils
          submodules: recursive
      - name: Initialize OpenHD ground receiver dependency
        run: |
          git -C sources/OpenHD submodule update --init --recursive --checkout OpenHD/ohd_interface/lib/devourer
          test -f sources/OpenHD/OpenHD/ohd_interface/lib/devourer/CMakeLists.txt
      - name: Prepare Debian component sources
        env:
          OPENHD_SNAPSHOT_NUMBER: ${{ inputs.openhd_ref == 'snapshots' && github.run_number || '' }}
        run: |
          for repo in OpenHD QOpenHD OpenHD-SysUtils; do
            printf '%s %s\n' "$repo" "$(git -C "sources/$repo" rev-parse HEAD)"
          done
          sudo apt-get update
          sudo apt-get install -y mmdebstrap rsync gnupg curl
          # Older QOpenHD refs need the x86 DRM/KMS backport.
          if [[ ! -f sources/QOpenHD/app/videostreaming/avcodec/drm_kms/x86_kms.cpp ]]; then
            git -C sources/QOpenHD apply ../../patches/qopenhd-debian-x86.patch
          fi
          git -C sources/QOpenHD apply ../../patches/qopenhd-session-switch.patch
          git -C sources/OpenHD-SysUtils apply ../../patches/sysutils-config-mount.patch
          python3 debian-x86/export-sources.py sources sources.tar.gz
          sudo --preserve-env=OPENHD_SNAPSHOT_NUMBER bash debian-x86/bootstrap-builder.sh /opt/openhd-os-work sources.tar.gz
      - name: Assemble the common Debian root
        if: inputs.output != 'packages'
        run: sudo bash debian-x86/make-root.sh /opt/openhd-os-work
      - name: Build and test the unified image
        if: inputs.output != 'packages'
        env:
          RELEASE_METADATA: ${{ inputs.release_metadata }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          work=/opt/openhd-os-work
          sudo env GITHUB_TOKEN="$GITHUB_TOKEN" bash debian-x86/add-desktop.sh "$work"
          jq -r '.apps[] | "\(.id) \(.version)"' "$work/desktop-apps.lock.json"
          sudo bash debian-x86/assemble-and-test.sh "$work" --test
          if [[ "$RELEASE_METADATA" == true ]]; then
            sudo cp "$work/desktop-apps.lock.json" "$work/output/"
          fi
      - name: Show VM diagnostics
        if: failure() && inputs.output != 'packages'
        run: |
          for log in /opt/openhd-os-work/output/vm-test/{qemu.log,serial.log}; do
            if [[ -f "$log" ]]; then sudo tail -n 120 "$log"; fi
          done
      - uses: actions/upload-artifact@v4
        if: inputs.output == 'packages'
        with:
          name: debian-amd64-packages
          path: /opt/openhd-os-work/builder/packages/*.deb
      - uses: actions/upload-artifact@v4
        if: inputs.output != 'packages'
        with:
          name: openhd-os-x86
          path: |
            /opt/openhd-os-work/output/openhd-os-x86.img
            ${{ inputs.release_metadata && '/opt/openhd-os-work/output/SHA256SUMS' || '' }}
            ${{ inputs.release_metadata && '/opt/openhd-os-work/desktop-apps.lock.json' || '' }}
          if-no-files-found: error
          retention-days: 7
